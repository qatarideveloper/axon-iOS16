name: Build Axon (roothide)

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up roothide Theos
        run: |
          # Must use roothide's fork so the `roothide` package scheme is recognised.
          # (The previous ubuntu workflow installed upstream theos, which does not
          #  know the roothide scheme and silently produced a ROOTFUL arm64e package.)
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Fetch an iOS SDK
        run: |
          # roothide/theos ships an (often empty) sdks/ dir; only fetch one if none present.
          if ! ls "$THEOS"/sdks/*.sdk >/dev/null 2>&1; then
            git clone -n --depth 1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
            cd /tmp/sdks
            git sparse-checkout set --no-cone iPhoneOS16.5.sdk
            git checkout
            cp -a iPhoneOS16.5.sdk "$THEOS/sdks/"
          fi
          ls "$THEOS/sdks"

      - name: Build package (roothide)
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Verify this is a roothide package (not rootful)
        run: |
          set -e
          deb="$(ls packages/*.deb | head -1)"
          echo "Built: $deb"
          # rootful packages are labelled iphoneos-arm64e; roothide/rootless are iphoneos-arm64
          case "$deb" in
            *iphoneos-arm64e*)
              echo "::error::Package built as ROOTFUL (arm64e). The roothide scheme did not apply — check that THEOS points at roothide/theos."
              exit 1;;
          esac
          echo "OK: architecture looks like roothide (arm64)."

      - name: List built packages
        run: ls -lh packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: axon-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
